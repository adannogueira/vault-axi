[package]
name = "vault-axi"
version = "1.1.2"
edition = "2021"
description = "Agent-ergonomic (AXI) CLI for reading, editing, and searching an Obsidian markdown vault."
license = "MIT"
default-run = "vault"

[workspace]
members = [".", "crates/core", "crates/core-wasm"]

[[bin]]
name = "vault"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6.0"
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
sha1 = "0.10"
toon-format = "0.4"
vault-axi-core = { path = "crates/core" }
ureq = { version = "2.12", features = ["json"] }


# Argon2id at 64 MiB is unusably slow unoptimized; keep debug builds and tests responsive.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
