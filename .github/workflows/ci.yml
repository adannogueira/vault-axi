name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (core-wasm for wasm32)
        run: cargo clippy -p vault-axi-core-wasm --target wasm32-unknown-unknown -- -D warnings

      - name: Run test suite
        run: cargo test --workspace --verbose

  plugin:
    name: Obsidian plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: plugin

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.1

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the WASM core
        run: npm run wasm

      - name: Build the CLI for interop tests
        run: cargo build
        working-directory: .

      - name: Typecheck, lint and test
        run: npm run check
        env:
          REQUIRE_CLI: "1"

      - name: Production bundle
        run: node esbuild.config.mjs production
