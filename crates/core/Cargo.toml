[package]
name = "vault-axi-core"
version = "0.1.0"
edition = "2021"
description = "I/O-free core shared by the vault-axi CLI and Obsidian plugin: crypto, merge, path rules and sync planning."
license = "MIT"
publish = false

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
sha2 = "0.10"

# Nonces and keys come from the OS RNG natively and from `crypto.getRandomValues` in WASM.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
serde_json = "1.0"
