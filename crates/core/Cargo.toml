[package]
name = "vault-axi-core"
version = "0.1.0"
edition = "2021"
description = "I/O-free core shared by the vault-axi CLI and Obsidian plugin: crypto, merge, path rules and sync planning."
license = "MIT"
publish = false

[dependencies]
aes-gcm = { version = "0.10", features = ["zeroize"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.22"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }

# Nonces and keys come from the OS RNG natively and from `crypto.getRandomValues` in WASM.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
