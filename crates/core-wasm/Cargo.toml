[package]
name = "vault-axi-core-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings of vault-axi-core for the Obsidian plugin."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
vault-axi-core = { path = "../core" }
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
